services:
  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8080}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
      VIDEO_ENGINE_URL: ${VIDEO_ENGINE_URL:-http://video-engine:8002}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
      - ai-service
      - video-engine

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
      VIDEO_ENGINE_URL: ${VIDEO_ENGINE_URL:-http://video-engine:8002}
      DATABASE_URL: ${DATABASE_URL:-postgres://aihuman:aihuman_dev_password@postgres:5432/aihuman?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_STREAM: ${REDIS_STREAM:-video_tasks}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
    ports:
      - "${BACKEND_HOST_PORT:-18080}:8080"
    depends_on:
      - ai-service
      - video-engine
      - redis
      - postgres

  ai-service:
    build:
      context: ./ai-service
    environment:
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"

  video-engine:
    build:
      context: ./video-engine
    environment:
      APP_ENV: ${APP_ENV:-development}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-http://minio:9000}
      OSS_PUBLIC_URL: ${OSS_PUBLIC_URL:-http://localhost:19000}
      OSS_BUCKET: ${OSS_BUCKET:-aihuman-assets}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-aihuman}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-aihuman_dev_password}
    ports:
      - "${VIDEO_ENGINE_PORT:-8002}:8002"
    depends_on:
      - minio

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aihuman}
      POSTGRES_USER: ${POSTGRES_USER:-aihuman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aihuman_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"

  qdrant:
    image: qdrant/qdrant:v1.9.5
    ports:
      - "${QDRANT_HOST_PORT:-16333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aihuman}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aihuman_dev_password}
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  qdrant-data:
  minio-data:
